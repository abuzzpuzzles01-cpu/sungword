name: Build TrollStore IPA (Design Minimalista)

on:
  push:
    branches: [ "main" ]

env:
  PROJECT_NAME: "meu-projeto"
  BIN_NAME: "palavracantada"
  CUSTOM_BUNDLE_ID: "br.com.zeroum.palavracantada"
  CUSTOM_DISPLAY_NAME: "Palavra Cantada" 
  NIB_NAME: "HomeView"
  FILES_URL: "https://abuzzpuzzleszips.b-cdn.net/git.zip" # 🔗 Cole o link direto do seu arquivo .zip aqui

jobs:
  build-trollstore:
    name: Criar Binário Mach-O e Montar IPA
    runs-on: macos-14

    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: 📥 Baixar e Extrair Arquivos para a pasta ${{ env.PROJECT_NAME }}
        run: |
          echo "🌐 Baixando arquivo da web..."
          curl -L "${{ env.FILES_URL }}" -o files.zip
          
          echo "📁 Criando a pasta do projeto e extraindo os arquivos..."
          mkdir -p "${{ env.PROJECT_NAME }}"
          unzip -o files.zip -d "${{ env.PROJECT_NAME }}"
          
          echo "🧹 Removendo o arquivo zip baixado..."
          rm files.zip
          echo "✅ Extração concluída!"

      - name: Selecionar Xcode do Sistema
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: ⚙️ Criar Binário Mach-O para iOS ARM64
        run: |
          echo "🔨 Compilando binário Mach-O nativo via clang..."
          
          cat << 'EOF' > /tmp/main.m
          #import <UIKit/UIKit.h>
          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, nil);
              }
          }
          EOF

          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios15.0 \
            -framework UIKit \
            -framework Foundation \
            -o "${{ env.BIN_NAME }}" \
            /tmp/main.m

          chmod +x "${{ env.BIN_NAME }}"
          echo "✅ Binário Mach-O criado com sucesso!"

      - name: Montar Estrutura do App Bundle (.app)
        run: |
          echo "📦 Criando a estrutura do App Bundle (.app)..."
          APP_BUNDLE="Payload/${{ env.BIN_NAME }}.app"
          mkdir -p "$APP_BUNDLE"
          
          # 1. Mover o binário Mach-O para dentro do App Bundle
          mv "${{ env.BIN_NAME }}" "$APP_BUNDLE/${{ env.BIN_NAME }}"
          
          # 2. Copiar TODOS os arquivos *.nib encontrados no projeto para dentro do App Bundle
          echo "📐 Copiando todos os arquivos *.nib..."
          find "${{ env.PROJECT_NAME }}" -name "*.nib" -exec cp -r {} "$APP_BUNDLE/" \;
          
          # 3. Copiar o Assets.car diretamente para dentro do App Bundle (se existir)
          echo "🎨 Copiando Assets.car..."
          if [ -f "${{ env.PROJECT_NAME }}/Assets.car" ]; then
            cp "${{ env.PROJECT_NAME }}/Assets.car" "$APP_BUNDLE/"
          fi
          
          # 4. Copiar os ícones Icon.png e Icon@2x.png (se existirem)
          echo "🖼 Copiando ícones..."
          if [ -f "${{ env.PROJECT_NAME }}/Icon.png" ]; then
            cp "${{ env.PROJECT_NAME }}/Icon.png" "$APP_BUNDLE/"
          fi
          if [ -f "${{ env.PROJECT_NAME }}/Icon@2x.png" ]; then
            cp "${{ env.PROJECT_NAME }}/Icon@2x.png" "$APP_BUNDLE/"
          fi

          # 5. Copiar mídias e imagens adicionais (áudios, vídeos e imagens PNG)
          echo "🎵 🎥 🖼️ Copiando mídias e recursos..."
          find "${{ env.PROJECT_NAME }}" -type f \( -name "*.mp3" -o -name "*.mp4" -o -name "*.png" \) ! -name "Icon*.png" -exec cp {} "$APP_BUNDLE/" \;

          echo "✅ Todos os recursos e NIBs foram injetados com sucesso dentro de $APP_BUNDLE"

      - name: Gerar e Injetar Info.plist com suporte ao NIB
        run: |
          APP_BUNDLE="Payload/${{ env.BIN_NAME }}.app"
          echo "📝 Criando Info.plist..."
          cat <<EOF > "$APP_BUNDLE/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>${{ env.CUSTOM_BUNDLE_ID }}</string>
              <key>CFBundleDisplayName</key>
              <string>${{ env.CUSTOM_DISPLAY_NAME }}</string>
              <key>CFBundleExecutable</key>
              <string>${{ env.BIN_NAME }}</string>
              <key>CFBundleName</key>
              <string>${{ env.BIN_NAME }}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>2026.0912</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              
              <key>CFBundleDevelopmentRegion</key>
              <string>pt</string>
              <key>CFBundleLocalizations</key>
              <array>
                  <string>pt</string>
              </array>
              
              <key>CFBundleIconFiles</key>
              <array>
                  <string>Icon</string>
              </array>

              <!-- Iniciar o aplicativo utilizando o NIB principal -->
              <key>NSMainNibFile</key>
              <string>${{ env.NIB_NAME }}</string>
              <key>NSMainNibFile~ipad</key>
              <string>${{ env.NIB_NAME }}</string>

              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Compactar em Arquivo .ipa para TrollStore
        run: |
          zip -r "${{ env.BIN_NAME }}.ipa" Payload

      - name: Salvar Artefato IPA
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-Final-IPA
          path: "*.ipa"
