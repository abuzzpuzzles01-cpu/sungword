name: Android CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    # Define a subpasta onde o código Android está localizado no repositório
    defaults:
      run:
        working-directory: ./android

    steps:
      # 1. Obtém o código fonte do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura o ambiente Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: 'android/*.gradle*'

      # 3. Garante que o gradle.properties contém as flags do AndroidX
      - name: Ensure gradle.properties has AndroidX enabled
        run: |
          if [ ! -f "gradle.properties" ]; then
            touch gradle.properties
          fi
          if ! grep -q "android.useAndroidX=true" gradle.properties; then
            echo "android.useAndroidX=true" >> gradle.properties
          fi
          if ! grep -q "android.enableJetifier=true" gradle.properties; then
            echo "android.enableJetifier=true" >> gradle.properties
          fi

      # 4. Garante e gera os arquivos do Gradle Wrapper se não existirem
      - name: Setup Gradle Wrapper if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew não encontrado. Gerando novo wrapper..."
            gradle wrapper --gradle-version 8.5
          fi

      # 5. Concede permissão de execução ao script gradlew no Ubuntu
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 6. Executa os testes unitários da aplicação
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # 7. Compila e gera o APK de Debug
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 8. Salva o APK gerado como um artefato do Workflow para download
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
